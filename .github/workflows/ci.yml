name: CI Pipeline

on:
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Linter (ESLint)
        run: npm run lint

      - name: Run Formatter (Prettier)
        run: npm run prettier

      - name: Run Tests (Jest)
        run: npm run test
        env:
          CI: true

      - name: Build Application
        run: npm run build
